              }
            ]
          },
          {
            // POIN 4: KONFIGURASI CLI & VERIFIKASI LANGKAH DEMI LANGKAH
            part: "Part 2: Inisialisasi Switch, SVI Manajemen VLAN 99 & Konfigurasi Host",
            desc: "Penetapan hostname, isolasi VLAN 99 untuk manajemen, alokasi port akses, dan pengalamatan IP PC.",
            cli: [

! Pembuatan VLAN Manajemen dan penetapan IP SVI

SW-SEC-01(config-vlan)# exit

SW-SEC-01(config-if)# no shutdown
SW-SEC-01(config-if)# exit

! Alokasikan antarmuka Fa0/1 ke VLAN 99 agar port dan SVI berstatus Up/Up
SW-SEC-01(config)# interface fastethernet 0/1
SW-SEC-01(config-if)# switchport mode access
SW-SEC-01(config-if)# switchport access vlan 99
SW-SEC-01(config-if)# exit

SW-SEC-01(config)# ip default-gateway 192.168.99.1`

            cli: [
              {
                label: "Aktivasi Enkripsi Kata Sandi & Kredensial Global",
                code: `SW-SEC-01(config)# enable secret CiscoPrivPass99!
SW-SEC-01(config)# service password-encryption

! Amankan Port Console Fisik

SW-SEC-01(config-line)# password ConsoleVault2026!
SW-SEC-01(config-line)# logging synchronous

            cli: [

          {
            q: "Apa fungsi dari perintah 'transport input ssh' dan apa akibatnya terhadap upaya login via Telnet?",
            a: "Perintah tersebut mengunci antarmuka virtual Line VTY agar hanya mendengarkan dan menerima segmen data dari port protokol SSH (TCP port 22). Segala upaya koneksi masuk berbasis Telnet (TCP port 23) akan langsung di-drop dan ditutup seketika oleh switch (Connection closed by foreign host)."
          },
          {
            q: "Mengapa kita menggunakan kombinasi 'login local' bersamaan dengan perintah 'username ... secret ...'?",
            a: "Perintah 'login local' mengalihkan mekanisme autentikasi dari kata sandi tunggal bersama (shared line password) ke basis data pengguna internal perangkat. Hal ini memungkinkan diterapkannya akuntabilitas personal (tiap admin memiliki username tersendiri) serta memastikan kredensial disimpan menggunakan algoritma hashing satu arah yang kuat."
          },
          {
            q: "Berapa panjang modulus RSA minimum yang direkomendasikan agar Cisco IOS dapat mengaktifkan protokol SSH Versi 2 (SSHv2)?",
            a: "Panjang modulus kunci RSA minimum untuk mengaktifkan SSHv2 pada Cisco IOS adalah 768 bit. Namun, standar keamanan modern merekomendasikan panjang modulus minimal 1024 bit atau 2048 bit guna memberikan ketahanan enkripsi yang memadai terhadap serangan brute-force kriptografi."

        ],

        // KOLOM INPUT TAUTAN VIDEO YOUTUBE
        // Masukkan ID video YouTube walkthrough Anda di antara tanda kutip di bawah ini (contoh: youtubeId: "dQw4w9WgXcQ")
        youtubeId: ""
      },
    ];

    let activeLabId = "srwe-basic-switch";

    // Toggle Sidebar State
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("-ml-80");
    }

    // Toggle Theme (Dark / Light)
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle("dark");
      localStorage.setItem("ccna_theme", isDark ? "dark" : "light");
      updateThemeUI(isDark);
    }

    function updateThemeUI(isDark) {
      document.getElementById("themeIconLight").classList.toggle("hidden", isDark);
      document.getElementById("themeIconDark").classList.toggle("hidden", !isDark);
      document.getElementById("themeLabel").textContent = isDark ? "Dark Mode" : "Light Mode";
    }

    // Filter Search
    function handleSearch(query) {
      const q = query.toLowerCase();
      const filtered = LAB_DATABASE.filter(lab => 
        lab.title.toLowerCase().includes(q) || 
        lab.code.toLowerCase().includes(q) || 
        lab.course.toLowerCase().includes(q)
      );
      renderSidebar(filtered);
    }

    // Render Menu Sidebar
    function renderSidebar(data = LAB_DATABASE) {
      const nav = document.getElementById("sidebarNav");
      nav.innerHTML = "";

      const courses = ["ITN", "SRWE", "ENSA"];
      const fullNames = {
        ITN: "Introduction to Networks",
        SRWE: "Switching, Routing & Wireless",
        ENSA: "Enterprise Networking"
      };

      courses.forEach(crs => {
        const labs = data.filter(l => l.course === crs);
        if (labs.length === 0) return;

        const box = document.createElement("div");
        box.className = "space-y-1";

        const label = document.createElement("p");
        label.className = "text-[11px] font-mono font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase px-2 mb-1.5";
        label.textContent = `${crs} - ${fullNames[crs]}`;
        box.appendChild(label);

        labs.forEach(lab => {
          const btn = document.createElement("button");
          const isActive = lab.id === activeLabId;
          btn.className = `w-full text-left px-3 py-2 rounded text-xs transition flex items-center justify-between font-mono ${
            isActive
              ? "bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white font-semibold border-l-2 border-blue-600 dark:border-blue-500"
              : "text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-slate-200"
          }`;
          btn.onclick = () => {
            activeLabId = lab.id;
            renderSidebar();
            renderContent(lab.id);
            if (window.innerWidth < 1024) toggleSidebar();
          };

          btn.innerHTML = `
            <span class="truncate">${lab.code} ${lab.title}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-500">${lab.badge}</span>
          `;
          box.appendChild(btn);
        });

        nav.appendChild(box);
      });
    }

    // Render Konten Lab
    function renderContent(labId) {
      const container = document.getElementById("contentArea");
      const lab = LAB_DATABASE.find(item => item.id === labId);
      if (!lab) return;

      document.getElementById("breadcrumb").textContent = `${lab.course} / ${lab.code} / ${lab.title}`;

      // 1. Objectives List
      let objectivesHtml = "";
      if (lab.objectives && lab.objectives.length > 0) {
        objectivesHtml = `
          <div class="border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 rounded p-5">
            <h3 class="font-mono text-xs uppercase font-bold text-slate-500 dark:text-slate-400 tracking-wider mb-3">Tujuan Praktikum (Lab Objectives)</h3>
            <ul class="list-disc list-inside space-y-1.5 text-xs text-slate-700 dark:text-slate-300 leading-relaxed font-sans">
              ${lab.objectives.map(o => `<li>${o}</li>`).join("")}
            </ul>
          </div>
        `;
      }

      // 2. Addressing Table
      let tableHtml = "";
      if (lab.addressingTable && lab.addressingTable.length > 0) {
        const rows = lab.addressingTable.map(r => `
          <tr class="border-b border-slate-200 dark:border-slate-800 font-mono text-xs">
            <td class="py-2.5 px-4 font-bold text-slate-900 dark:text-white">${r.device}</td>
            <td class="py-2.5 px-4 text-slate-600 dark:text-slate-400">${r.iface}</td>
            <td class="py-2.5 px-4 text-blue-600 dark:text-blue-400">${r.ipv4}</td>
            <td class="py-2.5 px-4 text-slate-700 dark:text-slate-300">${r.ipv6}</td>
            <td class="py-2.5 px-4 text-slate-600 dark:text-slate-400">${r.gateway}</td>
          </tr>
        `).join("");

        tableHtml = `
          <div class="border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 rounded overflow-hidden">
            <div class="p-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
              <h3 class="font-mono text-xs uppercase font-bold text-slate-700 dark:text-slate-300">Addressing Table (Tabel Pengalamatan)</h3>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left">
                <thead class="bg-slate-100 dark:bg-slate-800 text-[11px] font-mono uppercase text-slate-600 dark:text-slate-400 border-b border-slate-300 dark:border-slate-700">
                  <tr>
                    <th class="py-2 px-4">Device</th>
                    <th class="py-2 px-4">Interface</th>
                    <th class="py-2 px-4">IPv4 Address</th>
                    <th class="py-2 px-4">IPv6 Address / Prefix</th>
                    <th class="py-2 px-4">Default Gateway</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      // 3. Step by step & CLI
      let stepsHtml = "";
      if (lab.steps && lab.steps.length > 0) {
        stepsHtml = lab.steps.map((st, sIdx) => {
          let cliBlocks = "";
          if (st.cli) {
            cliBlocks = st.cli.map((c, cIdx) => `
              <div class="mt-3 border border-slate-300 dark:border-slate-800 rounded overflow-hidden bg-slate-950 font-mono">
                <div class="bg-slate-900 px-3 py-1.5 border-b border-slate-800 flex items-center justify-between text-[11px]">
                  <span class="text-slate-400 font-medium">${c.label}</span>
                  <button onclick="copyToClipboard('cli-${sIdx}-${cIdx}', this)" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] transition">
                    Salin
                  </button>
                </div>
                <pre class="p-4 text-xs text-emerald-400 overflow-x-auto leading-relaxed"><code id="cli-${sIdx}-${cIdx}">${c.code}</code></pre>
              </div>
            `).join("");
          }

          return `
            <div class="border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 rounded p-5 space-y-3">
              <h4 class="font-bold text-sm text-slate-900 dark:text-white font-mono">${st.part}</h4>
              <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-sans">${st.desc}</p>
              ${cliBlocks}
            </div>
          `;
        }).join("");
      }

      // 4. Questions & Reflections (Tanya Jawab Analisis)
      let reflectionsHtml = "";
      if (lab.reflections && lab.reflections.length > 0) {
        const qaItems = lab.reflections.map((rf, rIdx) => `
          <div class="p-4 rounded border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 space-y-2">
            <p class="text-xs font-semibold text-slate-900 dark:text-slate-200">
              <span class="text-blue-600 dark:text-blue-400 font-mono font-bold mr-1">Q${rIdx+1}:</span> ${rf.q}
            </p>
            <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed pl-5 border-l-2 border-slate-300 dark:border-slate-700 font-sans">
              <span class="font-mono font-semibold text-slate-700 dark:text-slate-300">Analisis:</span> ${rf.a}
            </p>
          </div>
        `).join("");

        reflectionsHtml = `
          <div class="border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 rounded p-5 space-y-4">
            <h3 class="font-mono text-xs uppercase font-bold text-slate-700 dark:text-slate-300 tracking-wider">Pertanyaan Analisis & Refleksi Lab</h3>
            <div class="space-y-3">${qaItems}</div>
          </div>
        `;
      }

      // 5. Video Area
      let videoHtml = "";
      if (lab.youtubeId) {
        videoHtml = `
          <div class="border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 rounded p-5 space-y-3">
            <h3 class="font-mono text-xs uppercase font-bold text-slate-700 dark:text-slate-300">Video Walkthrough & Pembahasan</h3>
            <div class="aspect-video w-full rounded overflow-hidden bg-black border border-slate-300 dark:border-slate-800">
              <iframe class="w-full h-full" src="https://www.youtube.com/embed/${lab.youtubeId}" frameborder="0" allowfullscreen></iframe>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <!-- Title & Subtitle -->
        <div class="space-y-2 border-b border-slate-300 dark:border-slate-800 pb-6">
          <div class="flex items-center gap-2">
            <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800">${lab.course}</span>
            <span class="text-xs font-mono text-slate-500">Modul ${lab.code}</span>
          </div>
          <h2 class="text-2xl font-bold text-slate-900 dark:text-white font-mono tracking-tight">${lab.title}</h2>
          <div class="mt-4 p-4 rounded bg-slate-50 dark:bg-slate-900 border-l-4 border-blue-600 text-xs text-slate-700 dark:text-slate-300 leading-relaxed font-sans">
            <span class="font-mono font-bold block mb-1 text-slate-900 dark:text-white">LATAR BELAKANG & TUJUAN DESAIN:</span>
            ${lab.background}
          </div>
        </div>

        <!-- Objectives -->
        ${objectivesHtml}

        <!-- Topologi Fisik & Logis -->
        <div class="border border-slate-300 dark:border-slate-800 bg-white dark:bg-slate-900 rounded p-5 space-y-3">
          <h3 class="font-mono text-xs uppercase font-bold text-slate-700 dark:text-slate-300 tracking-wider">Diagram Topologi Lab</h3>
          <div class="p-6 bg-slate-50 dark:bg-slate-950 rounded border border-dashed border-slate-300 dark:border-slate-800 flex items-center justify-center">
            <img 
              src="${lab.topologyImg}" 
              alt="Topology ${lab.title}" 
              class="max-h-80 object-contain mx-auto"
              onerror="this.parentElement.innerHTML='<div class=\\'text-xs font-mono text-slate-400 py-8 text-center\\'>[ File screenshot gambar topologi: ${lab.topologyImg} ]</div>'"
            >
          </div>
        </div>

        <!-- Addressing Table -->
        ${tableHtml}

        <!-- Panduan Konfigurasi & CLI -->
        <div class="space-y-4">
          <h3 class="font-mono text-xs uppercase font-bold text-slate-500 dark:text-slate-400 tracking-wider">Prosedur Konfigurasi & Verifikasi</h3>
          ${stepsHtml}
        </div>

        <!-- Tanya Jawab Refleksi -->
        ${reflectionsHtml}

        <!-- Video Walkthrough -->
        ${videoHtml}
      `;
    }

    // Fungsi Salin CLI
    function copyToClipboard(elementId, btn) {
      const code = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(code).then(() => {
        const origin = btn.textContent;
        btn.textContent = "Disalin!";
        btn.classList.add("text-emerald-400");
        setTimeout(() => {
          btn.textContent = origin;
          btn.classList.remove("text-emerald-400");
        }, 1800);
      });
    }

    // Inisialisasi awal
    window.addEventListener("DOMContentLoaded", () => {
      // Baca preference tema tersimpan
      const savedTheme = localStorage.getItem("ccna_theme");
      const isDark = savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (isDark) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
      updateThemeUI(isDark);

      renderSidebar();
      renderContent(activeLabId);

      // Keyboard Shortcut: Ctrl + B untuk Toggle Sidebar
      window.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") {
          e.preventDefault();
          toggleSidebar();
        }
      });
    });
  </script>
